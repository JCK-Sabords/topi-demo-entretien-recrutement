<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CV</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192x192.png" sizes="192x192" type="image/png">
<script>(function(){var k="topi-demo-theme",q=new URLSearchParams(location.search).get("theme"),t=null;try{if(q==="light"||q==="dark")localStorage.setItem(k,q);t=localStorage.getItem(k);}catch(e){}if(q==="light"||q==="dark")t=q;if(t==="light")document.documentElement.setAttribute("data-theme","light");})();</script>
<link rel="stylesheet" href="style.css?v=20261014c">
<style>
  .viewer { max-width: 900px; margin: 0 auto; padding: 28px 16px 56px; }
  .bar2 { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .bar2 h1 { font-size: 1.1rem; margin: 0; }
  .bar2 .btn { margin-left: auto; }
  canvas { display: block; width: 100%; height: auto; background: #fff; margin: 0 auto 16px; border-radius: 4px; box-shadow: 0 16px 40px var(--shadow-lg); }
  .msg { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html">TOPI</a>
  <span class="prod">Recrutement</span>
  <div class="right">Curriculum vitae · démonstration</div>
  <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Thème sombre activé. Passer au thème clair" title="Thème sombre activé. Passer au thème clair"><span class="tt-knob"></span><span class="tt-ic tt-sun"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="tt-ic tt-moon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></button>
</header>
<div class="viewer">
  <div class="bar2">
    <h1 id="title">Chargement du CV...</h1>
    <a class="btn" id="dl" download>Télécharger le PDF</a>
  </div>
  <div id="pages"><div class="msg">Chargement...</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const p = new URLSearchParams(location.search);
const file = p.get("f") || "";
const name = p.get("n") || "Curriculum vitae";
document.getElementById("title").textContent = "CV de " + name;
document.title = "CV - " + name;
const dl = document.getElementById("dl");
dl.href = file;

const box = document.getElementById("pages");
(async () => {
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument(file).promise;
    box.innerHTML = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 2 });
      const cv = document.createElement("canvas");
      cv.width = vp.width; cv.height = vp.height;
      box.appendChild(cv);
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    }
  } catch (e) {
    box.innerHTML = '<div class="msg">Impossible d\'afficher le CV ici. <a href="' + file + '">Ouvrir le PDF directement</a>.</div>';
  }
})();
</script>
<script src="theme.js?v=20261014c"></script>
</body>
</html>
